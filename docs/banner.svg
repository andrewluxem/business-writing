<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">business-writing</title>
<desc id="d">Three panels from the skill's worked example in SKILL.md, a description rather than a recorded run. 1, the request: Tighten this launch memo. We did a lot of work and results look strong, so I think we should probably expand soon. 2, the edit does not invent a result or date; it opens with the slot Recommendation and decision date needed, keeps the expansion as a recommendation rather than a decision, and labels the missing performance evidence. 3, the change scorecard records that the bottom line moved first, vague language became evidence slots, and no meaning change was made.</desc>
<style>
.serif{font-family:Georgia,"Times New Roman",serif}
.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.lab{font-size:10px;letter-spacing:1.8px;font-weight:600}
.cap{font-size:11.5px;fill:#8b9096}
.hl{fill:none;stroke-width:1.5;opacity:0}
.h1{animation:h1 12s infinite}
.h2{animation:h2 12s infinite}
.h3{animation:h3 12s infinite}
.r1{animation:r1 12s infinite}
.rb{animation:rb 12s infinite}
.rc{animation:rc 12s infinite}
.rd{animation:rd 12s infinite}
.re{animation:re 12s infinite}
.rf{animation:rf 12s infinite}
@keyframes h1{0%,16.7%{opacity:0}18.7%,42.4%{opacity:1}44.1%,100%{opacity:0}}
@keyframes h2{0%,16.7%,18.7%,44.1%{opacity:0}45.8%,67.8%{opacity:1}69.5%,100%{opacity:0}}
@keyframes h3{0%,16.7%,18.7%,69.5%{opacity:0}71.2%,94.9%{opacity:1}96.6%,100%{opacity:0}}
@keyframes r1{0%,16.7%{opacity:1}18.7%,21.2%{opacity:0}22.9%,100%{opacity:1}}
@keyframes rb{0%,16.7%{opacity:1}18.7%,45%{opacity:0}46.6%,100%{opacity:1}}
@keyframes rc{0%,16.7%{opacity:1}18.7%,52.6%{opacity:0}54.3%,100%{opacity:1}}
@keyframes rd{0%,16.7%{opacity:1}18.7%,59.3%{opacity:0}61%,100%{opacity:1}}
@keyframes re{0%,16.7%{opacity:1}18.7%,72.1%{opacity:0}73.7%,100%{opacity:1}}
@keyframes rf{0%,16.7%{opacity:1}18.7%,83.1%{opacity:0}84.8%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="300" fill="#141618"/>

<text x="32" y="50" class="serif" font-size="28" fill="#e4dfd4">business-writing</text>
<text x="255" y="50" class="sans" font-size="13.5" fill="#a9adb2">Static agent skill for editing, building, and auditing business documents</text>

<g>
<text x="32" y="88" class="sans lab" fill="#a39bbd">1 · A LAUNCH MEMO</text>
<rect x="32" y="98" width="244" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h1" x="32" y="98" width="244" height="152" rx="3" stroke="#a39bbd"/>
<text x="44" y="115" class="mono" font-size="10" fill="#8b9096">SKILL.md · worked example</text>
<line x1="33" y1="123" x2="275" y2="123" stroke="#2e3237"/>
<g class="r1"><rect x="44" y="152" width="220" height="66" rx="10" fill="#2a2e33"/><text x="56" y="171" class="sans" font-size="10.5" fill="#e4dfd4">Tighten this launch memo. We did a lot of</text><text x="56" y="185" class="sans" font-size="10.5" fill="#e4dfd4">work and results look strong, so I think we</text><text x="56" y="199" class="sans" font-size="10.5" fill="#e4dfd4">should probably expand soon.</text></g>
<text x="32" y="272" class="sans cap">Confident words, no evidence, no date.</text>
</g>

<g>
<text x="296" y="88" class="sans lab" fill="#c8963e">2 · GAPS STAY VISIBLE</text>
<rect x="296" y="98" width="296" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h2" x="296" y="98" width="296" height="152" rx="3" stroke="#c8963e"/>
<text x="308" y="115" class="mono" font-size="10" fill="#8b9096">SKILL.md · worked example</text>
<line x1="297" y1="123" x2="591" y2="123" stroke="#2e3237"/>
<g class="rb"><text x="308" y="143" class="sans" font-size="10.5" fill="#e4dfd4">The edit does not invent a result or date.</text><text x="308" y="161" class="sans" font-size="10.5" fill="#e4dfd4">It opens with</text></g>
<g class="rc"><rect x="305" y="167" width="241" height="17" fill="none" stroke="#93ad8c" stroke-dasharray="3 2"/><text x="308" y="179" class="mono" font-size="10" fill="#93ad8c">Recommendation and decision date needed</text><text x="550" y="179" class="sans" font-size="10.5" fill="#e4dfd4">,</text></g>
<g class="rd"><text x="308" y="201" class="sans" font-size="10.5" fill="#e4dfd4">retains the proposed expansion as a</text><text x="308" y="215" class="sans" font-size="10.5" fill="#e4dfd4">recommendation rather than a decision,</text><text x="308" y="229" class="sans" font-size="10.5" fill="#e4dfd4">and labels the missing performance evidence.</text></g>
<text x="296" y="272" class="sans cap">Missing facts become labeled slots.</text>
</g>

<g>
<text x="612" y="88" class="sans lab" fill="#93ad8c">3 · A CHANGE SCORECARD</text>
<rect x="612" y="98" width="256" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h3" x="612" y="98" width="256" height="152" rx="3" stroke="#93ad8c"/>
<text x="624" y="115" class="mono" font-size="10" fill="#8b9096">SKILL.md · worked example</text>
<line x1="613" y1="123" x2="867" y2="123" stroke="#2e3237"/>
<g class="re"><text x="624" y="143" class="sans" font-size="10.5" fill="#e4dfd4">The scorecard records that</text><text x="624" y="157" class="sans" font-size="10.5" fill="#e4dfd4">the bottom line moved first,</text><text x="624" y="171" class="sans" font-size="10.5" fill="#e4dfd4">vague language became evidence slots,</text><text x="624" y="185" class="sans" font-size="10.5" fill="#e4dfd4">and no meaning change was made.</text></g>
<g class="rf"><line x1="624" y1="196.5" x2="856" y2="196.5" stroke="#2e3237"/><text x="624" y="213" class="mono" font-size="10" fill="#8b9096">assets/change-scorecard.md</text><text x="624" y="228" class="mono" font-size="10" fill="#e4dfd4">Meaning changed during editing:</text><text x="624" y="242" class="mono" font-size="10" fill="#e4dfd4">[No | Yes, review the flagged rows]</text></g>
<text x="612" y="272" class="sans" font-size="11.5" fill="#93ad8c">The scorecard shows what changed and why.</text>
</g>
</svg>
